<style>
body {
    margin: 0;
    background: #fffaf0;
    color: #fff;
}

/* LCD */
#lcd {
    width: 520px;
    margin: 40px auto 10px;
    padding: 20px;
    background: #0000cd;
    border: 2px solid #444;
    box-shadow: 0 0 20px rgba(255,255,255,0.1);
    font-family: 'DotGothic16', monospace;
}

.line {
    height: 26px;
    white-space: pre;
}

.q { font-size: 22px; }

#buttons {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 20px;
}

.btn {
    width: 120px;
    height: 60px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    box-shadow: inset 0 0 10px #000;
    border: 2px solid #666;
    font-family: 'DotGothic16', monospace;
}

#yesBtn { background:#cc0000; }
#noBtn  { background:#0033cc; }

.disabled {
    filter: brightness(0.3);
    pointer-events: none;
}
</style>
</head>

<body>

<div id="lcd">
    <div class="line q" id="l0"></div>
    <div class="line" id="l1"></div>
    <div class="line" id="l2"></div>
    <div class="line" id="l3"></div>
</div>

<div id="buttons">
    <button class="btn" id="yesBtn" onclick="send('y')">YES</button>
    <button class="btn" id="noBtn" onclick="send('n')">NO</button>
</div>

<script>
let pyodide;
let resolver = null;
let started = false;
let phase = "idle";

const lines = [
    document.getElementById("l0"),
    document.getElementById("l1"),
    document.getElementById("l2"),
    document.getElementById("l3")
];

const yesBtn = document.getElementById("yesBtn");
const noBtn  = document.getElementById("noBtn");

function lcd(t){
    let a = t.split("\n");
    for(let i=0;i<4;i++){
        lines[i].textContent = (a[i] || "").padEnd(20," ");
    }
}

function setButtons(enable){
    yesBtn.classList.toggle("disabled", !enable);
    noBtn.classList.toggle("disabled", !enable);
}

function send(v){

    if(!started){
        started = true;
        start();
        return;
    }

    if(phase !== "question") return;

    if(resolver){
        resolver(v);
        resolver = null;
    }
}

function sleep(ms){
    return new Promise(r => setTimeout(r, ms));
}

/* ★修正ポイント：inputじゃなく単なる表示関数 */
async function show(text, ms=600){
    lcd(text);
    await sleep(ms);
}

async function js_input(text){
    phase = "question";
    setButtons(true);
    lcd(text);
    return new Promise(r => resolver = r);
}

async function init(){
    pyodide = await loadPyodide();
    pyodide.globals.set("js_input", js_input);
    pyodide.globals.set("sleep", sleep);
    pyodide.globals.set("show", show);

    lcd("PRESS START\nY / N");
    setButtons(true);
}
init();
